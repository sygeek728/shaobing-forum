name: Build Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.44.8'
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build-android:
    name: Android ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - arch: armeabi-v7a
            rust-target: armv7-linux-androideabi
            flutter-target: android-arm
          - arch: x86_64
            rust-target: x86_64-linux-android
            flutter-target: android-x64

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: android-${{ matrix.arch }}

      - name: Setup Android build environment
        run: |
          rustup target add ${{ matrix.rust-target }}
          cargo install cargo-ndk
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Configure Android NDK path
        run: |
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ndk_path}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Configure optional Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEY_PROPERTIES}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/upload-keystore.jks
            echo "${ANDROID_KEY_PROPERTIES}" > android/key.properties
          else
            echo "Android signing secrets not configured; using the Gradle fallback signing key."
          fi

      - name: Build APK
        run: |
          dart tool/flutterw.dart build apk \
            --release \
            --target-platform ${{ matrix.flutter-target }} \
            --dart-define=cronetHttpNoPlay=true \
            --split-debug-info=build/symbols
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep "lib/${{ matrix.arch }}/libdoh_proxy.so"
          cmp -s core/doh_proxy/certs/ca.der android/app/src/main/res/raw/proxy_ca.der
          cmp -s core/doh_proxy/certs/ca.crt assets/certs/proxy_ca.pem
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk "dist/shaobing-forum-${{ matrix.arch }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols-${{ matrix.arch }}
          path: build/symbols
          if-no-files-found: error
          retention-days: 30
